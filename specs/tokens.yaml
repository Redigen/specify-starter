    gradient:
      linear:
        type: linear
        deg: 45
        repeat: false
        stops:
          - color: "#FFFFFF"
            offset: 0%
          - color: "#000000"
            offset: 100%
      radial:
        type: radial
        width: 100%
        height: 80%
        position: bottom center
        repeat: false
        stops:
          - color: "#FFFFFF"
            offset: 0%
          - color: "#000000"
            offset: 100%
      angular:
        type: angular
        deg: 0
        position: center
        repeat: false
        stops:
          - color: "#FFFFFF"
            offset: 0%
          - color: "#000000"
            offset: 50%
          - color: "#FFFFFF"
            offset: 100%

