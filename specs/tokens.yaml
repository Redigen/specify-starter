    radius:
      xs: calc(t.radius.sm - t.spacing.100) # 2px
      sm: calc(t.radius.md - t.spacing.100) # 6px
      md: 10 # 10px
      lg: calc(t.radius.md + t.spacing.100) # 14
      xl: calc(t.radius.lg + t.spacing.100) # 18
      2xl: calc(t.radius.xl + t.spacing.100) # 22
      3xl: calc(t.radius.2xl + t.spacing.100) # 26
      full: 9999

    sizing:
      base: 4
      icon-xs: calc(t.sizing.base * 3) # 12px
      icon-sm: calc(t.sizing.base * 4) # 16px
      icon-md: calc(t.sizing.base * 5) # 20px
      icon-lg: calc(t.sizing.base * 6) # 24px
      icon-str-xs: calc(t.sizing.icon-str-lg * 2)
      icon-str-sm: calc(t.sizing.icon-str-lg * 1.5)
      icon-str-md: calc(t.sizing.icon-str-lg * 1.2)
      icon-str-lg: 1.45 # Base icons stroke weight

    spacing:
      base: 4
      25: calc(t.spacing.base * 0.25) # 1px
      50: calc(t.spacing.base * 0.5) # 2px
      75: calc(t.spacing.base * 0.75) # 3px
      100: t.spacing.base # 4px
      150: calc(t.spacing.base * 1.5) # 6px
      200: calc(t.spacing.base * 2) # 8px
      250: calc(t.spacing.base * 2.5) # 10px
      300: calc(t.spacing.base * 3) # 12px
      400: calc(t.spacing.base * 4) # 16px
      450: calc(t.spacing.base * 4.5) # 18px
      500: calc(t.spacing.base * 5) # 20px
      600: calc(t.spacing.base * 6) # 24px
      650: calc(t.spacing.base * 6.5) # 26px
      700: calc(t.spacing.base * 7) # 28px
      800: calc(t.spacing.base * 8) # 32px
      900: calc(t.spacing.base * 9) # 36px
      1000: calc(t.spacing.base * 10) # 40px
      1200: calc(t.spacing.base * 12) # 48px
      1500: calc(t.spacing.base * 15) # 60px
      1600: calc(t.spacing.base * 16) # 64px
      2000: calc(t.spacing.base * 20) # 80px
      2400: calc(t.spacing.base * 24) # 96px
      3200: calc(t.spacing.base * 32) # 128px
      depend-radius: calc(t.radius.md * 0.2)
      ios-top: env(safe-area-inset-top)
      ios-right: env(safe-area-inset-right)
      ios-bottom: env(safe-area-inset-bottom)
      ios-left: env(safe-area-inset-left)

    opacity:
